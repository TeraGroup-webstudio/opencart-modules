<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Page Checkout</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
  <style>
    :root{--bg:#080c18;--bg2:#0d1225;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--accent:#6366f1;--accent2:#8b5cf6;--text:#e2e8f0;--muted:#64748b}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .topnav{background:var(--bg2);border-bottom:1px solid var(--border);padding:.75rem 2rem}
    .topnav a{color:var(--muted);text-decoration:none;font-size:.85rem;display:inline-flex;align-items:center;gap:.4rem;transition:color .15s}
    .topnav a:hover{color:var(--text)}
    .hero{padding:3rem 2rem 2rem;background:linear-gradient(160deg,#0f1340 0%,#1a0f40 100%);border-bottom:1px solid var(--border);position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(99,102,241,.2) 0%,transparent 70%)}
    .hero-inner{max-width:900px;margin:0 auto;position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
    .hero-text{flex:1;min-width:200px}
    .hero-text h1{font-size:1.6rem;font-weight:800;line-height:1.3;background:linear-gradient(135deg,#a5b4fc,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hero-text .sub{color:var(--muted);font-size:.85rem;margin-top:.4rem}
    .btn-buy{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.4rem;background:linear-gradient(135deg,#d97706,#f59e0b);color:#000;font-weight:700;font-size:.85rem;border-radius:10px;text-decoration:none;white-space:nowrap;transition:opacity .15s,transform .1s}
    .btn-buy:hover{opacity:.85;transform:translateY(-1px)}
    .content{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
    section{margin-bottom:2.5rem}
    .sec-title{font-size:1rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
    .sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
    .dl-grid{display:flex;flex-wrap:wrap;gap:.75rem}
    .dl-btn{display:inline-flex;align-items:center;gap:.6rem;padding:.7rem 1.25rem;border-radius:10px;text-decoration:none;font-weight:600;font-size:.875rem;transition:opacity .15s,transform .1s;border:1px solid}
    .dl-btn:hover{opacity:.85;transform:translateY(-1px)}
    .dl-zip{background:rgba(16,185,129,.12);color:#34d399;border-color:rgba(16,185,129,.3)}
    .dl-size{font-size:.72rem;color:var(--muted);font-weight:400}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem}
    .gallery a{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--border);transition:transform .2s,border-color .2s,box-shadow .2s}
    .gallery a:hover{transform:scale(1.03);border-color:rgba(99,102,241,.5);box-shadow:0 8px 24px rgba(99,102,241,.2)}
    .gallery img{width:100%;height:110px;object-fit:cover;display:block}
    .readme{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;white-space:pre-wrap;font-size:.875rem;line-height:1.7;color:var(--text)}
    footer{text-align:center;padding:2rem;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border);margin-top:2rem}
    @media(max-width:640px){.hero-text h1{font-size:1.25rem}.gallery{grid-template-columns:repeat(2,1fr)}.content{padding:1.5rem 1rem}}
  </style>
</head>
<body>

<nav class="topnav"><a href="../">← Всі модулі</a></nav>

<div class="hero">
  <div class="hero-inner">
    <div style="display:flex;align-items:flex-start;gap:1rem;flex:1">
      <div style="font-size:3rem;line-height:1;flex-shrink:0">🛒</div>
      <div class="hero-text">
        <h1>One Page Checkout — Просте оформлення замовлення 1.5</h1>
        <div class="sub">OpenCart Forum · upload архів</div>
      </div>
    </div>
    <a href="https://opencartforum.com/files/file/9168-one-page-checkout-proste-oformlennya-zamovlennya/" target="_blank" class="btn-buy">🛒 Придбати</a>
  </div>
</div>

<div class="content">

  <section>
    <div class="sec-title">⬇ Завантажити</div>
    <div class="dl-grid">
      <a href="upload.zip" download class="dl-btn dl-zip">📦 upload.zip <span class="dl-size">файли модуля</span></a>
    </div>
  </section>

  <section>
    <div class="sec-title">🖼 Скриншоти налаштувань</div>
    <div class="gallery">
      <a href="Налаштування/01.png" class="glightbox" data-gallery="ss" data-title="Скриншот 01"><img src="Налаштування/01.png" alt="01" loading="lazy"></a>
      <a href="Налаштування/02.png" class="glightbox" data-gallery="ss" data-title="Скриншот 02"><img src="Налаштування/02.png" alt="02" loading="lazy"></a>
      <a href="Налаштування/03.png" class="glightbox" data-gallery="ss" data-title="Скриншот 03"><img src="Налаштування/03.png" alt="03" loading="lazy"></a>
      <a href="Налаштування/04.png" class="glightbox" data-gallery="ss" data-title="Скриншот 04"><img src="Налаштування/04.png" alt="04" loading="lazy"></a>
      <a href="Налаштування/05.png" class="glightbox" data-gallery="ss" data-title="Скриншот 05"><img src="Налаштування/05.png" alt="05" loading="lazy"></a>
      <a href="Налаштування/06.png" class="glightbox" data-gallery="ss" data-title="Скриншот 06"><img src="Налаштування/06.png" alt="06" loading="lazy"></a>
      <a href="Налаштування/07.png" class="glightbox" data-gallery="ss" data-title="Скриншот 07"><img src="Налаштування/07.png" alt="07" loading="lazy"></a>
      <a href="Налаштування/08.png" class="glightbox" data-gallery="ss" data-title="Скриншот 08"><img src="Налаштування/08.png" alt="08" loading="lazy"></a>
      <a href="Налаштування/09.png" class="glightbox" data-gallery="ss" data-title="Скриншот 09"><img src="Налаштування/09.png" alt="09" loading="lazy"></a>
      <a href="Налаштування/10.png" class="glightbox" data-gallery="ss" data-title="Скриншот 10"><img src="Налаштування/10.png" alt="10" loading="lazy"></a>
      <a href="Налаштування/11.png" class="glightbox" data-gallery="ss" data-title="Скриншот 11"><img src="Налаштування/11.png" alt="11" loading="lazy"></a>
      <a href="Налаштування/12.png" class="glightbox" data-gallery="ss" data-title="Скриншот 12"><img src="Налаштування/12.png" alt="12" loading="lazy"></a>
    </div>
  </section>

  <section>
    <div class="sec-title">📖 Інструкція</div>
    <div class="readme">Закидуємо весь вміст папки upload.</div>
  </section>

</div>

<footer>OpenCart Modules Collection</footer>
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script>GLightbox({ selector: '.glightbox', touchNavigation: true, loop: true });</script>
</body>
</html>
